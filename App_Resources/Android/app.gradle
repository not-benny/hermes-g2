import org.apache.tools.ant.taskdefs.condition.Os

// You can add your native dependencies here
dependencies {
//  implementation 'androidx.multidex:multidex:2.0.1'
  // WebSocket transport for the g2mirror terminal-mirroring client.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

def faceclawNodejsMobileVersion = "18.20.4"
def faceclawSherpaOnnxVersion = "1.13.0"
def faceclawLibLc3Version = "1.1.3"
def faceclawAsrModelName = "sherpa-onnx-moonshine-base-en-quantized-2026-02-27"
def faceclawAbi = "arm64-v8a"
def faceclawJniLibsDir = file("$projectDir/src/main/jniLibs/$faceclawAbi")
def faceclawAssetsDir = file("$projectDir/src/main/assets/faceclaw-voice-asr")
def faceclawNativeBuildDir = file("$buildDir/faceclaw-native")

def faceclawDownload = { String url, File destination ->
  if (destination.exists() && destination.length() > 0) {
    return
  }
  destination.parentFile.mkdirs()
  println "Downloading $url"
  destination.withOutputStream { output ->
    new URL(url).withInputStream { input ->
      output << input
    }
  }
}

def faceclawNdkHostTag = {
  if (Os.isFamily(Os.FAMILY_MAC)) return "darwin-x86_64"
  if (Os.isFamily(Os.FAMILY_WINDOWS)) return "windows-x86_64"
  return "linux-x86_64"
}

def faceclawFindNdkRoot = {
  def explicitNdk = System.getenv("ANDROID_NDK_HOME")
  if (explicitNdk != null && file(explicitNdk).exists()) {
    return file(explicitNdk)
  }
  def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
  if (sdkRoot != null) {
    def ndkDir = file("$sdkRoot/ndk")
    if (ndkDir.exists()) {
      def installed = ndkDir.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }
      if (installed && !installed.isEmpty()) {
        return installed[0]
      }
    }
  }
  try {
    return android.ndkDirectory
  } catch (Throwable ignored) {
    return null
  }
}

tasks.register("prepareFaceclawNativeLibs") {
  outputs.files(
    file("$faceclawJniLibsDir/libonnxruntime.so"),
    file("$faceclawJniLibsDir/libsherpa-onnx-jni.so"),
    file("$faceclawJniLibsDir/libfaceclaw_lc3.so"),
    file("$faceclawAssetsDir/$faceclawAsrModelName/encoder_model.ort"),
    file("$faceclawAssetsDir/$faceclawAsrModelName/decoder_model_merged.ort"),
    file("$faceclawAssetsDir/$faceclawAsrModelName/tokens.txt")
  )

  doLast {
    faceclawJniLibsDir.mkdirs()
    faceclawAssetsDir.mkdirs()

    def downloadsDir = file("$faceclawNativeBuildDir/downloads")
    def sherpaArchive = file("$downloadsDir/sherpa-onnx-v${faceclawSherpaOnnxVersion}-android.tar.bz2")
    faceclawDownload(
      "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${faceclawSherpaOnnxVersion}/sherpa-onnx-v${faceclawSherpaOnnxVersion}-android.tar.bz2",
      sherpaArchive
    )
    copy {
      from tarTree(resources.bzip2(sherpaArchive))
      include "**/jniLibs/$faceclawAbi/libonnxruntime.so"
      include "**/jniLibs/$faceclawAbi/libsherpa-onnx-jni.so"
      eachFile { details -> details.path = details.name }
      includeEmptyDirs = false
      into faceclawJniLibsDir
    }

    def asrArchive = file("$downloadsDir/${faceclawAsrModelName}.tar.bz2")
    faceclawDownload(
      "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${faceclawAsrModelName}.tar.bz2",
      asrArchive
    )
    copy {
      from tarTree(resources.bzip2(asrArchive))
      include "$faceclawAsrModelName/encoder_model.ort"
      include "$faceclawAsrModelName/decoder_model_merged.ort"
      include "$faceclawAsrModelName/tokens.txt"
      includeEmptyDirs = false
      into faceclawAssetsDir
    }

    def lc3Archive = file("$downloadsDir/liblc3-v${faceclawLibLc3Version}.tar.gz")
    faceclawDownload(
      "https://github.com/google/liblc3/archive/refs/tags/v${faceclawLibLc3Version}.tar.gz",
      lc3Archive
    )
    def lc3ExtractDir = file("$faceclawNativeBuildDir/liblc3")
    if (!file("$lc3ExtractDir/liblc3-${faceclawLibLc3Version}/src/lc3.c").exists()) {
      delete lc3ExtractDir
      copy {
        from tarTree(resources.gzip(lc3Archive))
        into lc3ExtractDir
      }
    }

    def ndkRoot = faceclawFindNdkRoot()
    if (ndkRoot == null || !ndkRoot.exists()) {
      throw new GradleException("Android NDK is required to build libfaceclaw_lc3.so")
    }
    def clang = file("$ndkRoot/toolchains/llvm/prebuilt/${faceclawNdkHostTag()}/bin/aarch64-linux-android24-clang")
    if (!clang.exists()) {
      throw new GradleException("Could not find Android clang at $clang")
    }

    def lc3Root = file("$lc3ExtractDir/liblc3-${faceclawLibLc3Version}")
    def lc3Sources = [
      "attdet.c", "bits.c", "bwdet.c", "energy.c", "lc3.c", "ltpf.c",
      "mdct.c", "plc.c", "sns.c", "spec.c", "tables.c", "tns.c"
    ].collect { file("$lc3Root/src/$it").absolutePath }

    exec {
      commandLine([
        clang.absolutePath,
        "-shared",
        "-fPIC",
        "-O3",
        "-DLC3_PLUS=0",
        "-DLC3_PLUS_HR=0",
        "-I${file("$lc3Root/include").absolutePath}",
        file("$projectDir/src/main/native/faceclaw_lc3_decoder.c").absolutePath
      ] + lc3Sources + [
        "-lm",
        "-Wl,-z,max-page-size=16384",
        "-Wl,-z,common-page-size=16384",
        "-o",
        file("$faceclawJniLibsDir/libfaceclaw_lc3.so").absolutePath
      ])
    }
  }
}

// On-phone assistant model: build llama.cpp (pinned release) + our JNI shim
// into libfaceclaw_llama.so. CPU-only, arm64, armv8.2 dotprod+fp16 baseline
// (Tensor G2 floor; no i8mm). The first build compiles llama.cpp (~2-4 min);
// afterwards the cached .so short-circuits everything.
def faceclawLlamaCppTag = "b10333"

def faceclawFindSdkCmakeDir = {
  def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
  if (sdkRoot == null) return null
  def cmakeRoot = file("$sdkRoot/cmake")
  if (!cmakeRoot.exists()) return null
  def installed = cmakeRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }
  return (installed && !installed.isEmpty()) ? installed[0] : null
}

tasks.register("prepareFaceclawLlama") {
  def llamaSo = file("$faceclawJniLibsDir/libfaceclaw_llama.so")
  inputs.files(
    file("$projectDir/src/main/native/llama/faceclaw_llama.cpp"),
    file("$projectDir/src/main/native/llama/CMakeLists.txt")
  )
  outputs.files(llamaSo)

  doLast {
    def llamaBuildDir = file("$faceclawNativeBuildDir/llama-build")
    def builtSo = file("$llamaBuildDir/libfaceclaw_llama.so")

    def downloadsDir = file("$faceclawNativeBuildDir/downloads")
    def llamaArchive = file("$downloadsDir/llama.cpp-${faceclawLlamaCppTag}.tar.gz")
    faceclawDownload(
      "https://github.com/ggml-org/llama.cpp/archive/refs/tags/${faceclawLlamaCppTag}.tar.gz",
      llamaArchive
    )
    def llamaSourceDir = file("$faceclawNativeBuildDir/llama.cpp-${faceclawLlamaCppTag}")
    if (!file("$llamaSourceDir/CMakeLists.txt").exists()) {
      copy {
        from tarTree(resources.gzip(llamaArchive))
        into faceclawNativeBuildDir
      }
    }

    def ndkRoot = faceclawFindNdkRoot()
    if (ndkRoot == null || !ndkRoot.exists()) {
      throw new GradleException("Android NDK is required to build libfaceclaw_llama.so")
    }
    def cmakeDir = faceclawFindSdkCmakeDir()
    if (cmakeDir == null) {
      throw new GradleException("Android SDK cmake package is required to build libfaceclaw_llama.so")
    }
    def cmake = file("$cmakeDir/bin/cmake")
    def ninja = file("$cmakeDir/bin/ninja")
    def march = "-march=armv8.2-a+dotprod+fp16"

    // Configure once; afterwards the ninja no-op build keeps this cheap while
    // still picking up JNI source edits.
    if (!file("$llamaBuildDir/build.ninja").exists()) {
      exec {
        commandLine([
          cmake.absolutePath,
          "-S", file("$projectDir/src/main/native/llama").absolutePath,
          "-B", llamaBuildDir.absolutePath,
          "-G", "Ninja",
          "-DCMAKE_MAKE_PROGRAM=${ninja.absolutePath}",
          "-DCMAKE_TOOLCHAIN_FILE=${file("$ndkRoot/build/cmake/android.toolchain.cmake").absolutePath}",
          "-DANDROID_ABI=arm64-v8a",
          "-DANDROID_PLATFORM=android-24",
          "-DCMAKE_BUILD_TYPE=Release",
          "-DLLAMA_CPP_SOURCE_DIR=${llamaSourceDir.absolutePath}",
          "-DCMAKE_C_FLAGS=$march",
          "-DCMAKE_CXX_FLAGS=$march",
        ])
      }
    }
    exec {
      commandLine([cmake.absolutePath, "--build", llamaBuildDir.absolutePath, "-j", "8"])
    }

    faceclawJniLibsDir.mkdirs()
    copy {
      from builtSo
      into faceclawJniLibsDir
    }
    // The static-linked lib carries llama.cpp's full debug info (~50MB);
    // strip it so the APK only pays for the code (~8MB).
    def ndkRootForStrip = faceclawFindNdkRoot()
    if (ndkRootForStrip != null) {
      def llvmStrip = file("$ndkRootForStrip/toolchains/llvm/prebuilt/${faceclawNdkHostTag()}/bin/llvm-strip")
      if (llvmStrip.exists()) {
        exec {
          commandLine([llvmStrip.absolutePath, "--strip-unneeded", llamaSo.absolutePath])
        }
      }
    }
  }
}

// Embedded Node.js runtime (nodejs-mobile) for the in-app WhatsApp engine.
// Downloads the prebuilt arm64 libnode.so + headers, stages libc++_shared.so
// (libnode NEEDs it), and compiles our JNI bridge (libnode-bridge.so) that
// calls node::Start. The first build downloads ~57MB + compiles the tiny
// bridge; afterwards the cached .so short-circuits.
tasks.register("prepareFaceclawNode") {
  def libnodeSo = file("$faceclawJniLibsDir/libnode.so")
  def nodeBridgeSo = file("$faceclawJniLibsDir/libnode-bridge.so")
  inputs.files(
    file("$projectDir/src/main/native/node/native-lib.cpp"),
    file("$projectDir/src/main/native/node/CMakeLists.txt")
  )
  outputs.files(libnodeSo, nodeBridgeSo)

  doLast {
    faceclawJniLibsDir.mkdirs()
    def downloadsDir = file("$faceclawNativeBuildDir/downloads")
    def nmZip = file("$downloadsDir/nodejs-mobile-v${faceclawNodejsMobileVersion}-android.zip")
    faceclawDownload(
      "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${faceclawNodejsMobileVersion}/nodejs-mobile-v${faceclawNodejsMobileVersion}-android.zip",
      nmZip
    )
    def nmDir = file("$faceclawNativeBuildDir/nodejs-mobile")
    if (!file("$nmDir/include/node/node.h").exists()) {
      copy {
        from zipTree(nmZip)
        into nmDir
      }
    }
    copy {
      from file("$nmDir/bin/$faceclawAbi/libnode.so")
      into faceclawJniLibsDir
    }

    def ndkRoot = faceclawFindNdkRoot()
    if (ndkRoot == null || !ndkRoot.exists()) {
      throw new GradleException("Android NDK is required to build libnode-bridge.so")
    }
    def libcxx = file("$ndkRoot/toolchains/llvm/prebuilt/${faceclawNdkHostTag()}/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
    if (libcxx.exists()) {
      copy { from libcxx; into faceclawJniLibsDir }
    } else {
      println "warning: libc++_shared.so not found at $libcxx (libnode.so needs it)"
    }

    def cmakeDir = faceclawFindSdkCmakeDir()
    if (cmakeDir == null) {
      throw new GradleException("Android SDK cmake package is required to build libnode-bridge.so")
    }
    def cmake = file("$cmakeDir/bin/cmake")
    def ninja = file("$cmakeDir/bin/ninja")
    def nodeBuildDir = file("$faceclawNativeBuildDir/node-build")
    if (!file("$nodeBuildDir/build.ninja").exists()) {
      exec {
        commandLine([
          cmake.absolutePath,
          "-S", file("$projectDir/src/main/native/node").absolutePath,
          "-B", nodeBuildDir.absolutePath,
          "-G", "Ninja",
          "-DCMAKE_MAKE_PROGRAM=${ninja.absolutePath}",
          "-DCMAKE_TOOLCHAIN_FILE=${file("$ndkRoot/build/cmake/android.toolchain.cmake").absolutePath}",
          "-DANDROID_ABI=arm64-v8a",
          "-DANDROID_PLATFORM=android-24",
          "-DANDROID_STL=c++_shared",
          "-DCMAKE_BUILD_TYPE=Release",
          "-DFACECLAW_LIBNODE_SO=${libnodeSo.absolutePath}",
          "-DFACECLAW_NODE_INCLUDE=${file("$nmDir/include/node").absolutePath}",
        ])
      }
    }
    exec {
      commandLine([cmake.absolutePath, "--build", nodeBuildDir.absolutePath, "-j", "8"])
    }
    copy {
      from file("$nodeBuildDir/libnode-bridge.so")
      into faceclawJniLibsDir
    }
  }
}

// The in-app WhatsApp engine (Baileys) + node_modules is shipped as a single
// prebuilt zip asset (src/main/assets/whatsapp-node.zip), regenerated from
// App_Resources/Android/whatsapp-node/ by whatsapp-node/build-zip.sh whenever
// the engine source changes (the source dir is not copied into the generated
// gradle project, so this is kept out of the build).
android {
  compileSdkVersion 35
  buildToolsVersion "35"
  // ndkVersion ""

  sourceSets.main {
    jniLibs.srcDirs += ["$projectDir/src/main/jniLibs"]
  }

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35
    ndk {
      abiFilters "arm64-v8a"
    }

    // Version Information
    versionCode 1
    versionName "1.0.0"
    
    generatedDensities = []
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }

  // NativeScript's runtime and nodejs-mobile both ship libc++_shared.so; keep
  // the first so packaging does not fail on the duplicate.
  packagingOptions {
    pickFirst "lib/arm64-v8a/libc++_shared.so"
  }
}

tasks.matching { it.name == "preBuild" }.configureEach {
  dependsOn tasks.named("prepareFaceclawNativeLibs")
  dependsOn tasks.named("prepareFaceclawLlama")
  dependsOn tasks.named("prepareFaceclawNode")
}
