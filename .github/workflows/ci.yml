name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.8-9/x64
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install locked dependencies
        run: npm ci
      - name: Host tests and private-data log sentinels
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Diff hygiene
        run: git diff --check "${{ github.event.before || 'HEAD^' }}" HEAD
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX dependency inventory
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json
      - name: Android JDK 21 / SDK 35 build
        run: npm run build
      - name: Verify APK integrity, privacy, and native alignment
        run: bash scripts/verify-release-artifacts.sh
      - name: Record APK and SBOM provenance
        run: |
          apk=$(find platforms/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          sha256sum "$apk" sbom.cdx.json > SHA256SUMS
          printf 'source=%s\nnode=%s\njava=%s\n' "$GITHUB_SHA" "$(node --version)" "$(java -version 2>&1 | sed -n '1p')" > PROVENANCE.txt
      - name: Upload verified evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-g2-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            SHA256SUMS
            PROVENANCE.txt
            sbom.cdx.json
            build/reports/native-alignment.txt
          if-no-files-found: error
          retention-days: 30
