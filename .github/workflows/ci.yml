name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018" "cmake;3.22.1" "emulator"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix App_Resources/Android/whatsapp-node ci --omit=dev --omit=optional --ignore-scripts
      - name: Host tests and private-data log sentinels
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Diff hygiene
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          git diff --check "$base"...HEAD
      - name: Runtime dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix App_Resources/Android/whatsapp-node audit --omit=dev --audit-level=high
      - name: Generate CycloneDX dependency inventory
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
          npm --prefix App_Resources/Android/whatsapp-node sbom --sbom-format=cyclonedx > whatsapp-sbom.cdx.json
      - name: Configure protected upgrade-compatible signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hermes-signing.keystore"
          chmod 600 "$RUNNER_TEMP/hermes-signing.keystore"
          printf 'ANDROID_SIGNING_STORE_FILE=%s\nANDROID_SIGNING_STORE_PASSWORD=%s\nANDROID_SIGNING_KEY_ALIAS=%s\nANDROID_SIGNING_KEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/hermes-signing.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Android JDK 21 / SDK 35 build
        run: npm run build
      - name: Verify APK integrity, privacy, and native alignment
        run: bash scripts/verify-release-artifacts.sh
      - name: Record APK and SBOM provenance
        run: |
          apk=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          sha256sum "$apk" sbom.cdx.json whatsapp-sbom.cdx.json > SHA256SUMS
          printf 'source=%s\nsize=%s\nnode=%s\njava=%s\n' "$GITHUB_SHA" "$(stat -c %s "$apk")" "$(node --version)" "$(java -version 2>&1 | sed -n '1p')" > PROVENANCE.txt
      - name: Upload verified evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-g2-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS
            PROVENANCE.txt
            sbom.cdx.json
            whatsapp-sbom.cdx.json
            build/reports/native-alignment.txt
          if-no-files-found: error
          retention-days: 30
