name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HERMES_SIGNING_MODE: untrusted
      HERMES_PROTECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      HERMES_ARTIFACT_VARIANT: debug
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Isolate untrusted Android signing home
        run: printf 'ANDROID_USER_HOME=%s\n' "$RUNNER_TEMP/hermes-untrusted-android" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018" "cmake;3.22.1" "emulator"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix App_Resources/Android/whatsapp-node ci --omit=dev --omit=optional --ignore-scripts
      - name: Host tests and private-data log sentinels
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Diff hygiene
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          git diff --check "$base"...HEAD
      - name: Runtime dependency audit
        run: |
          npm audit --audit-level=high
          npm --prefix App_Resources/Android/whatsapp-node audit --omit=dev --audit-level=high
      - name: Generate CycloneDX dependency inventory
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
          npm --prefix App_Resources/Android/whatsapp-node sbom --sbom-format=cyclonedx > whatsapp-sbom.cdx.json
      - name: Android JDK 21 / SDK 35 build
        run: npm run build
      - name: Verify APK integrity, privacy, and native alignment
        run: bash scripts/verify-release-artifacts.sh
      - name: Build unsigned release variant and verify debug surface is absent
        env:
          HERMES_SIGNING_MODE: unsigned
          HERMES_ARTIFACT_VARIANT: release
        run: |
          npm run verify:release-unsigned
          bash scripts/verify-release-artifacts.sh platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Record release APK and SBOM provenance
        run: |
          apk=platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          sha256sum "$apk" sbom.cdx.json whatsapp-sbom.cdx.json > SHA256SUMS
          printf 'source=%s\nsize=%s\nsigning_mode=unsigned\nvariant=release\nnode=%s\njava=%s\n' "$GITHUB_SHA" "$(stat -c %s "$apk")" "$(node --version)" "$(java -version 2>&1 | sed -n '1p')" > PROVENANCE.txt
      - name: Upload untrusted validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-g2-untrusted-validation-${{ github.sha }}
          path: |
            SHA256SUMS
            PROVENANCE.txt
            sbom.cdx.json
            whatsapp-sbom.cdx.json
            build/reports/native-alignment.txt
          if-no-files-found: error
          retention-days: 7
