name: Protected Release Validation

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: main-build-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HERMES_SIGNING_MODE: unsigned
      HERMES_ARTIFACT_VARIANT: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Isolate untrusted Android signing home
        run: printf 'ANDROID_USER_HOME=%s\n' "$RUNNER_TEMP/hermes-untrusted-android" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018" "cmake;3.22.1" "emulator"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix App_Resources/Android/whatsapp-node ci --omit=dev --omit=optional --ignore-scripts
      - name: Host tests and private-data log sentinels
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Diff hygiene
        run: |
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          git diff --check "$base"...HEAD
      - name: Runtime dependency audit
        run: |
          npm audit --audit-level=high
          npm --prefix App_Resources/Android/whatsapp-node audit --omit=dev --audit-level=high
      - name: Generate CycloneDX dependency inventory
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
          npm --prefix App_Resources/Android/whatsapp-node sbom --sbom-format=cyclonedx > whatsapp-sbom.cdx.json
      - name: Android JDK 21 / SDK 35 unsigned release build
        run: npm run verify:release-unsigned
      - name: Verify unsigned release integrity, privacy, and debug-surface exclusion
        run: bash scripts/verify-release-artifacts.sh platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload isolated signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-g2-unsigned-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
            sbom.cdx.json
            whatsapp-sbom.cdx.json
            build/reports/native-alignment.txt
          if-no-files-found: error
          retention-days: 1

  sign:
    name: protected-release
    needs: build
    if: vars.PROTECTED_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download isolated signing input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hermes-g2-unsigned-${{ github.sha }}
          path: signing-input
      - name: Sign and verify with protected identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            printf 'Protected Android signing credentials are required and must be complete.\n' >&2
            exit 1
          fi
          input=signing-input/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          apk=signing-input/hermes-g2-release.apk
          if [[ ! -f "$input" || -L "$input" ]]; then
            printf 'Isolated signing input is missing or invalid.\n' >&2
            exit 1
          fi
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.1/apksigner
          AAPT=/usr/local/lib/android/sdk/build-tools/35.0.1/aapt
          if [[ ! -x "$APKSIGNER" || ! -x "$AAPT" ]]; then
            printf 'Pinned Android artifact tools are unavailable.\n' >&2
            exit 1
          fi
          verify_unsigned_container() {
            local candidate=$1
            python3 - "$candidate" <<'PY'
          import struct, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              for name in archive.namelist():
                  upper = name.upper()
                  if upper.startswith("META-INF/") and (
                      upper == "META-INF/MANIFEST.MF" or upper.endswith((".SF", ".RSA", ".DSA", ".EC"))
                  ):
                      raise SystemExit("Signing input contains a v1 signature entry")
          with open(path, "rb") as source:
              source.seek(0, 2)
              size = source.tell()
              start = max(0, size - 65557)
              source.seek(start)
              tail = source.read()
              index = tail.rfind(b"PK\x05\x06")
              if index < 0 or index + 20 > len(tail):
                  raise SystemExit("Signing input has no APK end-of-central-directory record")
              central_offset = struct.unpack_from("<I", tail, index + 16)[0]
              if not entries:
                  raise SystemExit("Signing input is empty")
              last = max(entries, key=lambda entry: entry.header_offset)
              source.seek(last.header_offset)
              header = source.read(30)
              if len(header) != 30 or header[:4] != b"PK\x03\x04":
                  raise SystemExit("Signing input has an invalid local header")
              name_length, extra_length = struct.unpack_from("<HH", header, 26)
              data_end = last.header_offset + 30 + name_length + extra_length + last.compress_size
              if last.flag_bits & 0x08:
                  source.seek(data_end)
                  descriptor_signature = source.read(4)
                  zip64 = last.compress_size > 0xFFFFFFFF or last.file_size > 0xFFFFFFFF
                  data_end += (24 if zip64 else 16) if descriptor_signature == b"PK\x07\x08" else (20 if zip64 else 12)
              if data_end != central_offset:
                  raise SystemExit("Signing input has pre-central-directory signing material")
          PY
            if "$APKSIGNER" verify "$candidate" >/dev/null 2>&1; then
              printf 'Signing input must be the verified unsigned release artifact.\n' >&2
              return 1
            fi
          }
          verify_release_surface() {
            local candidate=$1 manifest badging
            manifest=$($AAPT dump xmltree "$candidate" AndroidManifest.xml)
            for marker in FaceclawDebugControlReceiver com.faceclaw.app.DEBUG_CONTROL_V1 android.permission.DUMP; do
              if [[ "$manifest" == *"$marker"* ]]; then
                printf 'Release artifact exposes debug-only manifest surface: %s\n' "$marker" >&2
                return 1
              fi
            done
            badging=$($AAPT dump badging "$candidate")
            if [[ "$badging" == *"application-debuggable"* ]]; then
              printf 'Release artifact is debuggable.\n' >&2
              return 1
            fi
            python3 - "$candidate" <<'PY'
          import sys, zipfile
          blocked_dex = (b"FaceclawDebugControlReceiver", b"com.faceclaw.app.DEBUG_CONTROL_V1")
          blocked_js = (b"HERMES_DEBUG_CONTROL_RUNTIME_V1", b"voice.fixture", b"capture-offline", b"DebugControlHarness")
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in archive.namelist():
                  if name.startswith("classes") and name.endswith(".dex"):
                      data = archive.read(name)
                      if any(marker in data for marker in blocked_dex):
                          raise SystemExit("Release artifact contains debug-only code surface")
                  if name.startswith("assets/app/") and name.endswith(".mjs"):
                      data = archive.read(name)
                      if any(marker in data for marker in blocked_js):
                          raise SystemExit("Release artifact contains debug-control JavaScript")
          PY
          }
          verify_unsigned_container "$input"
          verify_release_surface "$input"
          cp "$input" "$apk"
          umask 077
          keystore="$RUNNER_TEMP/hermes-signing.keystore"
          partial="$keystore.part"
          trap 'rm -f "$partial" "$keystore"' EXIT
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$partial" || [[ ! -s "$partial" ]]; then
            printf 'Protected Android signing keystore is invalid.\n' >&2
            exit 1
          fi
          mv "$partial" "$keystore"
          "$APKSIGNER" sign --debuggable-apk-permitted false --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD "$apk"
          "$APKSIGNER" verify --verbose "$apk" >/dev/null
          verify_release_surface "$apk"
          expected=f64ccdb8d462b42c6d143cb1323350b052acebc0a5023e14d05fea86ef7766d4
          actual=$($APKSIGNER verify --print-certs "$apk" | python3 -c 'import sys
          for line in sys.stdin:
              if "certificate SHA-256 digest:" in line:
                  print(line.rsplit(":", 1)[1].strip().lower()); break')
          if [[ "$actual" != "$expected" ]]; then
            printf 'Protected APK certificate verification failed.\n' >&2
            exit 1
          fi
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" signing-input/sbom.cdx.json signing-input/whatsapp-sbom.cdx.json > SHA256SUMS
          printf 'source=%s\nsize=%s\nsigning_mode=protected\nvariant=release\n' "$GITHUB_SHA" "$(stat -c %s "$apk")" > PROVENANCE.txt
      - name: Upload protected release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-g2-${{ github.sha }}
          path: |
            signing-input/hermes-g2-release.apk
            SHA256SUMS
            PROVENANCE.txt
            signing-input/sbom.cdx.json
            signing-input/whatsapp-sbom.cdx.json
            signing-input/build/reports/native-alignment.txt
          if-no-files-found: error
          retention-days: 30
