name: One-shot prune merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: startsWith(github.event.head_commit.message, 'chore: prune merged branches')
    runs-on: ubuntu-latest

    steps:
      - name: Delete only fully merged, unprotected, unused branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const openHeads = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === `${owner}/${repo}`)
                .map((pull) => pull.head.ref),
            );
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );

            const deleted = [];
            const skipped = [];
            const failed = [];

            for (const branch of branches) {
              if (branch.name === defaultBranch) {
                skipped.push(`${branch.name}: default branch`);
                continue;
              }
              if (branch.protected) {
                skipped.push(`${branch.name}: protected`);
                continue;
              }
              if (openHeads.has(branch.name)) {
                skipped.push(`${branch.name}: open pull request`);
                continue;
              }

              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branch.name}...${defaultBranch}`,
                });
                const fullyReachable =
                  comparison.data.behind_by === 0 &&
                  (comparison.data.status === 'ahead' || comparison.data.status === 'identical');
                if (!fullyReachable) {
                  skipped.push(
                    `${branch.name}: not fully reachable from ${defaultBranch} ` +
                    `(status=${comparison.data.status}, behind_by=${comparison.data.behind_by})`,
                  );
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                deleted.push(branch.name);
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                failed.push(`${branch.name}: ${error.message}`);
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }

            await core.summary
              .addHeading('Merged branch pruning')
              .addRaw(`Deleted (${deleted.length}): ${deleted.join(', ') || 'none'}\n\n`)
              .addRaw(`Skipped (${skipped.length}): ${skipped.join('; ') || 'none'}\n\n`)
              .addRaw(`Failed (${failed.length}): ${failed.join('; ') || 'none'}\n`)
              .write();

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/prune-merged-branches.yml
          git commit -m "chore: remove one-shot branch-pruning workflow"
          git push origin HEAD:main
